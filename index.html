<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siddharth's Thesis Defense Seminar Invitation</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e6ddd0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- ───────────────────────────  CARD  ─────────────────────────── -->
<article class="card" id="card" aria-live="polite">
  <div class="card-inner">
    <div class="card-body" id="card-body">

      <!-- pane 1 · the invitation -->
      <section class="pane" id="pane-invite">
        <p class="eyebrow" id="c-eyebrow"></p>
        <h1 class="title" id="c-title"></h1>
        <p class="subtitle" id="c-subtitle"></p>
        <div class="rule"></div>
        <div class="lines" id="c-lines"></div>
        <p class="footer-line" id="c-footer"></p>
        <div class="actions">
          <button type="button" class="btn" id="btn-rsvp">RSVP</button>
        </div>
      </section>

      <!-- pane 2 · the form -->
      <section class="pane" id="pane-form" hidden>
        <h2 class="title title-sm">Reply</h2>
        <div class="rule"></div>

        <form id="rsvp-form" novalidate>
          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" name="name" type="text" required autocomplete="name">
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" required autocomplete="email">
          </div>

          <div class="field">
            <span class="label-as-legend">Attending</span>
            <div class="segmented" role="radiogroup" aria-label="Attending">
              <input type="radio" id="a-person" name="attendance" value="in-person" checked>
              <label for="a-person">In person</label>
              <input type="radio" id="a-remote" name="attendance" value="remote">
              <label for="a-remote">Remotely</label>
              <input type="radio" id="a-no" name="attendance" value="regrets">
              <label for="a-no">Cannot attend</label>
              <span class="segmented-thumb" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field">
            <label for="f-note">Note <em>(optional)</em></label>
            <textarea id="f-note" name="note" rows="2"></textarea>
          </div>

          <p class="form-err" id="form-err" role="alert" hidden></p>
          <p class="form-fallback" id="form-fallback" hidden>
            <a id="form-mailto" href="#">Send your reply by email instead</a>
          </p>

          <div class="actions actions-split">
            <button type="button" class="btn btn-quiet" id="btn-back">Back</button>
            <button type="submit" class="btn" id="btn-send">Send</button>
          </div>
        </form>
      </section>

      <!-- pane 3 · confirmation -->
      <section class="pane" id="pane-done" hidden>
        <p class="eyebrow" id="d-eyebrow">Received</p>
        <h2 class="title title-sm" id="d-title">Thank you</h2>
        <div class="rule"></div>
        <p class="lines" id="d-msg"></p>
        <div class="cal" id="d-cal">
          <p class="cal-label">Add to your calendar</p>
          <div class="actions actions-split">
            <a class="btn btn-quiet" id="cal-google" target="_blank" rel="noopener">Google</a>
            <a class="btn btn-quiet" id="cal-ics" download="invitation.ics">Apple &middot; Outlook</a>
          </div>
        </div>
        <p class="footer-line"><button type="button" class="linkish" id="btn-amend">Change your reply</button></p>
      </section>

    </div>
  </div>
</article>

<!-- ───────────────────────────  SOUND  ────────────────────────── -->
<div class="sound" id="sound" hidden>
  <span class="sound-title" id="sound-title"></span>
  <button type="button" class="sound-btn" id="sound-btn"
          aria-pressed="false" aria-label="Toggle music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 9.6v4.8h3L12 18.3V5.7L7.5 9.6h-3z"/>
      <path class="wave" d="M15 9.6a3.4 3.4 0 0 1 0 4.8"/>
      <path class="wave" d="M17.5 7.3a6.9 6.9 0 0 1 0 9.4"/>
      <path class="slash" d="M15.4 9.9l4.8 4.2"/>
    </svg>
  </button>
</div>

<audio id="audio" preload="none"></audio>

<script src="assets/app.js"></script>
</body>
</html>
